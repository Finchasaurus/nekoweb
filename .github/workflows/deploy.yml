name: Deploy to Nekoweb

on:
    push:
        branches:
            - lyra

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Upload site to Nekoweb
              env:
                  NEKOWEB_API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
              run: |
                  set -e

                  for file in $(find . -type f \
                    ! -path "./.git/*" \
                    ! -path "./.github/*"); do

                    relpath="${file#./}"
                    echo "Uploading $relpath"

                    curl -sSf \
                      -H "Authorization: $NEKOWEB_API_KEY" \
                      -F "pathname=/" \
                      -F "file=@$file;filename=$relpath" \
                      https://nekoweb.org/api/files/upload
                  done
